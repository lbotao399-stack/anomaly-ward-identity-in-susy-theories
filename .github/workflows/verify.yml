name: verify

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  repository-policy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
      - run: >-
          sudo apt-get update &&
          sudo apt-get install -y
          poppler-utils
          texlive-latex-base
          texlive-latex-extra
          texlive-pictures
      - run: python3 -m pip install --break-system-packages "sympy>=1.12" "PyYAML>=6.0"
      - run: python3 -m unittest discover -s tests -v
